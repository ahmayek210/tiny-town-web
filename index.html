<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>Tiny Town</title>
	<link id="-gd-engine-icon" rel="icon" type="image/png" href="tiny-town-20261119-responsive.icon.png" />
<link rel="apple-touch-icon" href="tiny-town-20261119-responsive.apple-touch-icon.png"/>

	<style>
		html, body {
			margin: 0;
			overflow: hidden;
			overscroll-behavior: none;
			color: white;
			background: black;
		}
		[hidden] { display: none !important; }
		#shell {
			position: fixed;
			left: var(--visible-left, 0px);
			top: var(--visible-top, 0px);
			width: var(--visible-width, 100%);
			height: 100vh;
			height: var(--visible-height, 100dvh);
			box-sizing: border-box;
			padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
				env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
			display: grid;
			background: black;
		}
		#play-area {
			position: relative;
			display: grid;
			place-items: center;
			min-width: 0;
			min-height: 0;
		}
		#frame { position: relative; }
		#canvas {
			display: block;
			width: 100%;
			height: 100%;
			touch-action: none;
		}
		#canvas:focus { outline: none; }
		#status {
			position: absolute;
			inset: 0;
			display: grid;
			place-items: center;
			background: #242424;
			font: 1rem system-ui, sans-serif;
		}
		#splash {
			position: absolute;
			max-width: 100%;
			max-height: 100%;
		}
		#splash.show-image--false { display: none; }
		#splash.fullsize--true { width: 100%; height: 100%; object-fit: contain; }
		#splash.use-filter--false { image-rendering: pixelated; }
		#progress { position: absolute; bottom: 10%; width: 50%; }
		#error {
			z-index: 1;
			max-width: 85%;
			margin: 0;
			padding: .75rem 1rem;
			background: #5b3943;
			border-radius: .5rem;
			white-space: pre-wrap;
		}
		#rotate {
			position: absolute;
			top: min(85%, calc(50% + var(--frame-half-height, 0px) + 1rem));
			left: 50%;
			transform: translateX(-50%);
			width: max-content;
			max-width: 90%;
			margin: 0;
			font: 1rem system-ui, sans-serif;
			text-align: center;
			pointer-events: none;
		}
	</style>
</head>
<body>
	<main id="shell">
		<div id="play-area">
			<div id="frame">
				<canvas id="canvas" width="1280" height="720" aria-label="Tiny Town game">
					Your browser does not support the canvas tag.
				</canvas>
			</div>
			<p id="rotate" role="status" hidden>Rotate your phone to play</p>
			<div id="status" aria-label="Loading Tiny Town">
				<img id="splash" class="show-image--true fullsize--true use-filter--true" src="tiny-town-20261119-responsive.png" alt="">
				<progress id="progress" aria-label="Game loading progress"></progress>
				<p id="error" role="alert" hidden></p>
				<noscript>Your browser does not support JavaScript.</noscript>
			</div>
		</div>
	</main>
	<script src="tiny-town-20261119-responsive.js"></script>
	<script>
		const shell = document.getElementById("shell");
		const playArea = document.getElementById("play-area");
		const frame = document.getElementById("frame");
		const canvas = document.getElementById("canvas");
		const rotate = document.getElementById("rotate");
		const handsOn = matchMedia("(pointer: coarse) and (hover: none)");
		const preferContained = new URLSearchParams(location.search).get("layout") === "contained";
		const maxBufferPixels = 2_500_000;
		let gameplay = false;
		let blocked = false;
		let ready = false;
		let fullscreenRequested = false;
		let layoutFrame = 0;
		let previousFrame = null;

		function layout() {
			layoutFrame = 0;
			const viewport = window.visualViewport;
			const fitVisible = viewport && Math.abs(viewport.scale - 1) < 0.01;
			for (const [property, value] of [
				["width", viewport?.width], ["height", viewport?.height],
				["left", viewport?.offsetLeft], ["top", viewport?.offsetTop]
			]) {
				const name = "--visible-" + property;
				if (fitVisible) shell.style.setProperty(name, value + "px");
				else shell.style.removeProperty(name);
			}
			const { width, height } = playArea.getBoundingClientRect();
			if (width < 1 || height < 1) return;
			const aspect = width / height;
			const contained = preferContained || aspect < 1.25 || aspect > 2.5;
			const unit = Math.min(width / 16, height / 9);
			const cssWidth = contained ? unit * 16 : width;
			const cssHeight = contained ? unit * 9 : height;
			const density = Math.min(window.devicePixelRatio || 1, 2, Math.sqrt(maxBufferPixels / (cssWidth * cssHeight)));
			const bufferUnit = Math.max(1, Math.round(unit * density));
			const bufferWidth = contained ? bufferUnit * 16 : Math.max(1, Math.round(cssWidth * density));
			const bufferHeight = contained ? bufferUnit * 9 : Math.max(1, Math.round(cssHeight * density));
			const bufferChanged = canvas.width !== bufferWidth || canvas.height !== bufferHeight;
			frame.style.width = cssWidth + "px";
			frame.style.height = cssHeight + "px";
			const bounds = frame.getBoundingClientRect();
			TinyTownWeb.canvasCssWidth = bounds.width;
			playArea.style.setProperty("--frame-half-height", cssHeight / 2 + "px");
			const portrait = handsOn.matches && height > width;
			rotate.hidden = !ready || !portrait;
			const blockGameplay = portrait && gameplay;
			const mappingChanged = previousFrame && (
				bounds.x !== previousFrame.x || bounds.y !== previousFrame.y ||
				bounds.width !== previousFrame.width || bounds.height !== previousFrame.height
			);
			if (ready && (bufferChanged || mappingChanged || (!blocked && blockGameplay))) {
				TinyTownWeb.cancelInput?.();
			}
			previousFrame = bounds;
			blocked = blockGameplay;
			canvas.inert = blocked;
			// Godot's None policy leaves the buffer under shell control. The Web
			// display server detects these dimensions and updates the viewport.
			if (bufferChanged) {
				canvas.width = bufferWidth;
				canvas.height = bufferHeight;
			}
		}

		function scheduleLayout() {
			if (!layoutFrame) layoutFrame = requestAnimationFrame(layout);
		}

		window.TinyTownWeb = {
			canvasCssWidth: 0,
			setGameplay(active) {
				gameplay = active;
				scheduleLayout();
			},
			async enterFullscreen() {
				if (!handsOn.matches || fullscreenRequested || document.fullscreenElement ||
					!document.fullscreenEnabled || typeof shell.requestFullscreen !== "function" ||
					navigator.userActivation?.isActive === false) return;
				fullscreenRequested = true;
				try {
					await shell.requestFullscreen({ navigationUI: "hide" });
					if (document.fullscreenElement === shell && typeof screen.orientation?.lock === "function") {
						await screen.orientation.lock("landscape");
					}
				} catch {
					// Keep playing in the usable browser viewport when the browser declines.
				} finally {
					scheduleLayout();
				}
			}
		};

		// A touch stream can keep its initial target after rotation.
		canvas.addEventListener("touchcancel", () => TinyTownWeb.cancelInput?.(), { capture: true });
		for (const type of ["touchstart", "touchmove", "touchend", "mousedown", "mousemove", "mouseup"]) {
			canvas.addEventListener(type, event => {
				if (!blocked) return;
				event.preventDefault();
				event.stopImmediatePropagation();
			}, { capture: true, passive: false });
		}
		for (const type of ["resize", "pageshow", "focus"]) {
			window.addEventListener(type, scheduleLayout);
		}
		document.addEventListener("fullscreenchange", scheduleLayout);
		document.addEventListener("visibilitychange", scheduleLayout);
		window.visualViewport?.addEventListener("resize", scheduleLayout);
		window.visualViewport?.addEventListener("scroll", scheduleLayout);
		screen.orientation?.addEventListener("change", scheduleLayout);
		handsOn.addEventListener("change", scheduleLayout);
		layout();

		const status = document.getElementById("status");
		const progress = document.getElementById("progress");
		const notice = document.getElementById("error");
		const missing = Engine.getMissingFeatures({ threads: false });
		const engine = new Engine({"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"tiny-town-20261119-responsive","experimentalVK":false,"fileSizes":{"tiny-town-20261119-responsive.pck":14503072,"tiny-town-20261119-responsive.wasm":39513091},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});
		function showError(error) {
			console.error(error);
			progress.hidden = true;
			notice.textContent = error.message || String(error);
			notice.hidden = false;
		}
		if (missing.length) {
			showError("Your browser is missing features required to play Tiny Town.\n" + missing.join("\n"));
		} else {
			engine.startGame({
				canvas,
				onProgress(current, total) {
					if (total > 0) {
						progress.max = total;
						progress.value = current;
					} else {
						progress.removeAttribute("value");
					}
				}
			}).then(() => {
				status.remove();
				ready = true;
				scheduleLayout();
			}, showError);
		}
	</script>
</body>
</html>
